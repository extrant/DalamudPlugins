# 定时把 pluginmaster.json 里 GitHub Release 发布的插件的 DownloadCount / LastUpdate 换成真实数据。
# 见 .github/scripts/update_download_counts.py；raw.githubusercontent.com 链接的插件 GitHub 不统计下载，保持原样。
name: Update download counts

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时一次（UTC）
  workflow_dispatch:          # Actions 页面也可以手动跑

permissions:
  contents: write

concurrency:
  group: download-counts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pluginmaster.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_download_counts.py pluginmaster.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- pluginmaster.json; then
            echo "没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "Update download counts"
          # 跑的期间有人推了新提交：先变基再推（只改两个数字，一般不会冲突）
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
